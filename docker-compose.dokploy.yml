services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDER_IMAGE: ubuntu:24.04
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
        FORCE_CUDA: "0"
    command: ["gunicorn", "-k", "uvicorn.workers.UvicornWorker", "--chdir", "./src", "drivers.rest.app:app", "--bind", "0.0.0.0:5060", "--timeout", "10000"]
    init: true
    restart: unless-stopped
    expose:
      - "5060"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  gui:
    build:
      context: .
      dockerfile: Dockerfile.gradio
    command: ["python", "./src/drivers/gradio_app.py"]
    init: true
    restart: unless-stopped
    expose:
      - "7860"
    environment:
      - API_BASE_URL=http://api:5060
    depends_on:
      - api

volumes:
  ollama-data:
